<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhwani Realtime STT Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      padding: 2rem;
      border: 1px solid #334155;
    }
    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin: 1.5rem 0;
    }
    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    #startBtn {
      background-color: #22c55e;
      color: #0f172a;
    }
    #startBtn:hover:not(:disabled) {
      background-color: #16a34a;
      transform: translateY(-1px);
    }
    #stopBtn {
      background-color: #ef4444;
      color: #ffffff;
    }
    #stopBtn:hover:not(:disabled) {
      background-color: #dc2626;
      transform: translateY(-1px);
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
    }
    .dot.recording {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }
    .dot.error {
      background: #ef4444;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #334155;
      color: #94a3b8;
    }
    .log-container {
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .log-item {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      background: #1e293b;
      border-left: 3px solid #38bdf8;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-in;
    }
    .log-item.turn {
      border-left-color: #a855f7;
      background: #281d38;
      color: #f3e8ff;
      font-weight: 500;
    }
    .log-item.error {
      border-left-color: #ef4444;
      background: #351a1a;
      color: #fca5a5;
    }
    .empty-state {
      color: #64748b;
      font-style: italic;
      font-size: 0.85rem;
      margin: auto;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Dhwani Speech-to-Text</h1>
      <p class="subtitle">Stream 16 kHz 16-bit PCM via WebSocket to Gnani STT</p>
    </header>

    <div class="controls">
      <button id="startBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        Start
      </button>
      <button id="stopBtn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
        Stop
      </button>
    </div>

    <div class="status-bar">
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Ready</span>
      </div>
      <div id="statsText" style="color: #64748b; font-size: 0.8rem;">16 kHz &bull; 16-bit mono</div>
    </div>

    <div class="panels">
      <!-- Live Segments -->
      <div class="card">
        <div class="card-title">
          <span>Live Segments (Forwarded Transcripts)</span>
          <span class="badge" id="segmentCount">0</span>
        </div>
        <div class="log-container" id="segmentsContainer">
          <div class="empty-state">No speech segments received yet. Click Start and speak.</div>
        </div>
      </div>

      <!-- Joined Turns -->
      <div class="card">
        <div class="card-title">
          <span>Joined Turns (After 1.2s Silence)</span>
          <span class="badge" id="turnCount">0</span>
        </div>
        <div class="log-container" id="turnsContainer">
          <div class="empty-state">No completed turns yet.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inline AudioWorklet Processor for 16 kHz 16-bit PCM conversion
    const workletCode = `
      class PCMProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.targetSampleRate = 16000;
        }

        process(inputs, outputs, parameters) {
          const input = inputs[0];
          if (!input || !input[0]) return true;

          const inputData = input[0];
          const sourceSampleRate = sampleRate;

          let resampled;
          if (sourceSampleRate === this.targetSampleRate) {
            resampled = inputData;
          } else {
            // Linear interpolation to 16 kHz
            const ratio = sourceSampleRate / this.targetSampleRate;
            const targetLength = Math.round(inputData.length / ratio);
            resampled = new Float32Array(targetLength);
            for (let i = 0; i < targetLength; i++) {
              const srcIdx = i * ratio;
              const i0 = Math.floor(srcIdx);
              const i1 = Math.min(i0 + 1, inputData.length - 1);
              const frac = srcIdx - i0;
              resampled[i] = inputData[i0] * (1 - frac) + inputData[i1] * frac;
            }
          }

          // Convert Float32 to 16-bit PCM Int16Array
          const pcm16 = new Int16Array(resampled.length);
          for (let i = 0; i < resampled.length; i++) {
            const s = Math.max(-1, Math.min(1, resampled[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }

          // Transfer buffer to main thread
          this.port.postMessage(pcm16.buffer, [pcm16.buffer]);
          return true;
        }
      }
      registerProcessor('pcm-processor', PCMProcessor);
    `;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const segmentsContainer = document.getElementById('segmentsContainer');
    const turnsContainer = document.getElementById('turnsContainer');
    const segmentCountBadge = document.getElementById('segmentCount');
    const turnCountBadge = document.getElementById('turnCount');

    let audioContext = null;
    let mediaStream = null;
    let workletNode = null;
    let sourceNode = null;
    let muteNode = null;
    let socket = null;
    let segmentCount = 0;
    let turnCount = 0;

    function setStatus(text, state = 'idle') {
      statusText.textContent = text;
      statusDot.className = 'dot';
      if (state === 'recording') statusDot.classList.add('recording');
      if (state === 'error') statusDot.classList.add('error');
    }

    function addSegment(text) {
      if (segmentCount === 0) segmentsContainer.innerHTML = '';
      segmentCount++;
      segmentCountBadge.textContent = segmentCount;

      const item = document.createElement('div');
      item.className = 'log-item';
      item.textContent = text;
      segmentsContainer.appendChild(item);
      segmentsContainer.scrollTop = segmentsContainer.scrollHeight;
    }

    function addTurn(text) {
      if (turnCount === 0) turnsContainer.innerHTML = '';
      turnCount++;
      turnCountBadge.textContent = turnCount;

      const item = document.createElement('div');
      item.className = 'log-item turn';
      item.textContent = text;
      turnsContainer.appendChild(item);
      turnsContainer.scrollTop = turnsContainer.scrollHeight;
    }

    function addError(message) {
      const item = document.createElement('div');
      item.className = 'log-item error';
      item.textContent = 'Error: ' + message;
      segmentsContainer.appendChild(item);
      segmentsContainer.scrollTop = segmentsContainer.scrollHeight;
    }

    async function startCapture() {
      try {
        startBtn.disabled = true;
        setStatus('Connecting to WebSocket...', 'idle');

        // Determine WebSocket endpoint
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host || 'localhost:8000';
        const wsUrl = `${protocol}//${host}/ws/stt`;

        socket = new WebSocket(wsUrl);
        socket.binaryType = 'arraybuffer';

        socket.onopen = async () => {
          try {
            setStatus('Requesting microphone access...', 'idle');
            mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                channelCount: 1,
                sampleRate: 16000,
                echoCancellation: true,
                noiseSuppression: true,
              }
            });

            audioContext = new (window.AudioContext || window.webkitAudioContext)({
              sampleRate: 16000
            });

            // Load AudioWorklet from Blob URL
            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);
            await audioContext.audioWorklet.addModule(workletUrl);

            sourceNode = audioContext.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioContext, 'pcm-processor');

            // Send raw binary PCM audio buffer over WebSocket
            workletNode.port.onmessage = (event) => {
              if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(event.data);
              }
            };

            // Connect nodes; route through 0-gain node to destination to prevent feedback while keeping pipeline active
            sourceNode.connect(workletNode);
            muteNode = audioContext.createGain();
            muteNode.gain.value = 0;
            workletNode.connect(muteNode);
            muteNode.connect(audioContext.destination);

            stopBtn.disabled = false;
            setStatus('Listening and streaming audio...', 'recording');
          } catch (audioErr) {
            setStatus('Mic error: ' + audioErr.message, 'error');
            stopCapture();
          }
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'segment') {
              addSegment(data.text);
            } else if (data.type === 'turn') {
              addTurn(data.text);
            } else if (data.type === 'error') {
              addError(data.message);
            }
          } catch (err) {
            console.error('Failed to parse WebSocket message:', err);
          }
        };

        socket.onerror = (e) => {
          setStatus('WebSocket error', 'error');
        };

        socket.onclose = () => {
          setStatus('Disconnected', 'idle');
          stopCapture();
        };

      } catch (err) {
        setStatus('Failed to start: ' + err.message, 'error');
        stopCapture();
      }
    }

    function stopCapture() {
      // Disconnect and stop media tracks
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      if (workletNode) {
        workletNode.disconnect();
        workletNode = null;
      }
      if (muteNode) {
        muteNode.disconnect();
        muteNode = null;
      }
      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
        audioContext = null;
      }
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
        socket.close();
        socket = null;
      }

      startBtn.disabled = false;
      stopBtn.disabled = true;
      if (statusDot.classList.contains('recording')) {
        setStatus('Stopped', 'idle');
      }
    }

    startBtn.addEventListener('click', startCapture);
    stopBtn.addEventListener('click', stopCapture);
  </script>
</body>
</html>
